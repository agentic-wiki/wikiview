<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser which canvas to paint *before* any stylesheet loads.
         Without it the first frame is the UA default white, which is a visible
         flash on a dark system. The stylesheet itself is a render-blocking
         <link> that Vite emits, so nothing else paints unstyled. -->
    <meta name="color-scheme" content="light dark" />
    <title>wikiview</title>
    <script>
      // Applied before the first paint, and before any bundle loads. A stored
      // preference read after React mounts would show the system theme first and
      // then correct itself — the flash the color-scheme meta above exists to
      // avoid, reintroduced one layer up.
      try {
        var t = localStorage.getItem("wiki:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        // Storage can be unavailable (private mode, blocked cookies). The system
        // theme is a fine answer; the toggle just will not persist.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
